<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibekU々 - Profile Card</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --accent: #34d399;
    --accent-dim: rgba(52, 211, 153, 0.25);
  }

  * { -webkit-tap-highlight-color: transparent; }

  body {
    background: radial-gradient(circle at 50% 20%, #0d1f14 0%, #050b07 70%);
  }

  .card {
    animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tag {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tag:hover {
    transform: translateY(-2px);
    border-color: rgba(52, 211, 153, 0.6);
    background-color: rgba(20, 50, 34, 0.7);
    box-shadow: 0 4px 12px -2px rgba(52, 211, 153, 0.15);
  }

  .connect-btn {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .connect-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px -4px var(--accent-dim);
  }
  .connect-btn:active { transform: scale(0.96); }

  .social-link {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .social-link:hover {
    transform: translateY(-2px);
    border-color: rgba(52, 211, 153, 0.5);
    background-color: rgba(20, 48, 33, 0.9);
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.5);
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .tag, .connect-btn, .social-link { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="h-full min-h-screen w-full flex items-center justify-center p-4 sm:p-6 m-0 overflow-x-hidden">

  <!-- Main Glassmorphism Card Container -->
  <div class="card w-full max-w-sm sm:max-w-md md:max-w-lg rounded-3xl bg-[#09140e]/90 backdrop-blur-xl text-[#e2e8f0] shadow-[0_25px_60px_-15px_rgba(16,185,129,0.18)] ring-1 ring-emerald-500/20 overflow-hidden font-sans my-auto">

    <!-- Enhanced Banner Image Section -->
    <div class="h-36 sm:h-44 w-full relative bg-[#0e2216] overflow-hidden">
      <img
        src="background.png"
        alt="Profile banner"
        class="w-full h-full object-cover opacity-80 scale-105 transition-transform duration-700 hover:scale-100"
        loading="lazy"
      />
      <!-- Dynamic Multilayer Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#09140e] via-[#09140e]/40 to-transparent"></div>
    </div>

    <!-- Card Content Body -->
    <div class="px-5 sm:px-7 pb-6 pt-0 relative">

      <!-- Avatar & Action Header -->
      <div class="flex justify-between items-end -mt-12 sm:-mt-14 mb-4">
        <div class="relative inline-block group">
          <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full overflow-hidden border-[5px] border-[#09140e] bg-[#0c1a12] shadow-xl shadow-emerald-950/60">
            <img
              src="profile.png"
              alt="BibekU々 avatar"
              class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
              loading="lazy"
            />
          </div>
          <!-- Online status dot with pulse effect -->
          <span class="absolute bottom-1.5 right-1.5 flex h-5 w-5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-5 w-5 border-[3px] border-[#09140e] bg-emerald-400"></span>
          </span>
        </div>

        <button class="connect-btn bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-bold text-xs sm:text-sm px-6 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20">
          Connect
        </button>
      </div>

      <!-- Info Inner Section -->
      <div class="bg-[#0e1d15]/80 rounded-2xl p-4 sm:p-5 border border-emerald-500/10 space-y-4 shadow-inner">

        <!-- Title & Bio Info -->
        <div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-xl sm:text-2xl font-black text-white tracking-tight">! BibekU々</h2>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-400 fill-current shrink-0" viewBox="0 0 24 24">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
          </div>
          <p class="text-xs sm:text-sm text-emerald-400/90 font-medium tracking-wide mt-0.5">@aoibibeku • 18 • he/him</p>
        </div>

        <div class="h-px bg-emerald-900/40 w-full"></div>

        <!-- About Me / Badges Grid -->
        <div>
          <h3 class="text-[11px] sm:text-xs font-bold text-emerald-400/80 uppercase tracking-widest mb-2.5">About Me</h3>
          <div class="grid grid-cols-2 gap-2 text-sm text-[#cbd5e1]">
            <div class="tag flex items-center gap-2.5 bg-[#12241b] px-3.5 py-2.5 rounded-xl border border-emerald-800/40">
              <span class="text-base">🎌</span><span class="font-semibold text-xs sm:text-sm text-white truncate">Anime</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#12241b] px-3.5 py-2.5 rounded-xl border border-emerald-800/40">
              <span class="text-base">🎮</span><span class="font-semibold text-xs sm:text-sm text-white truncate">Gamer</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#12241b] px-3.5 py-2.5 rounded-xl border border-emerald-800/40">
              <span class="text-base">🎵</span><span class="font-semibold text-xs sm:text-sm text-white truncate">Music</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#12241b] px-3.5 py-2.5 rounded-xl border border-emerald-800/40">
              <span class="text-base">🎨</span><span class="font-semibold text-xs sm:text-sm text-white truncate">Artist</span>
            </div>
          </div>
        </div>

        <!-- Connected Accounts List -->
        <div class="pt-1">
          <h3 class="text-[11px] sm:text-xs font-bold text-emerald-400/80 uppercase tracking-widest mb-2.5">Connected Accounts</h3>

          <div class="space-y-2.5">
            <!-- Instagram -->
            <a href="https://instagram.com/aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-xl bg-[#12241b]/90 border border-emerald-800/40 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-400 bg-emerald-950/60 p-2 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                    <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-bold text-white tracking-wide">Instagram</span>
                  <span class="text-[11px] text-emerald-400/70 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-400 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-xl bg-[#12241b]/90 border border-emerald-800/40 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-400 bg-emerald-950/60 p-2 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-bold text-white tracking-wide">TikTok</span>
                  <span class="text-[11px] text-emerald-400/70 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-400 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>

            <!-- X (Twitter) -->
            <a href="https://x.com/aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-xl bg-[#12241b]/90 border border-emerald-800/40 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-400 bg-emerald-950/60 p-2 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-bold text-white tracking-wide">X (Twitter)</span>
                  <span class="text-[11px] text-emerald-400/70 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-400 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>

            <!-- Discord Server -->
            <a href="https://discord.gg/2y3frhSBRU" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-xl bg-[#12241b]/90 border border-emerald-800/40 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-400 bg-emerald-950/60 p-2 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-bold text-white tracking-wide">Discord Server</span>
                  <span class="text-[11px] text-emerald-400/70 truncate">discord.gg/2y3frhSBRU</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-400 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"/>
              </svg>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
