<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BibekU々 - Profile Card</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --accent: #4ade80;
    --accent-dim: #22c55e33;
  }

  * { -webkit-tap-highlight-color: transparent; }

  body {
    background: radial-gradient(circle at 50% 0%, #16241b 0%, #0a110d 70%);
  }

  .card {
    animation: floatIn .5s cubic-bezier(.16,1,.3,1);
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tag {
    transition: transform .18s ease, border-color .18s ease, background-color .18s ease;
  }
  .tag:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background-color: #1a3826;
  }

  .connect-btn {
    transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .connect-btn:hover {
    background-color: #22c55e;
    box-shadow: 0 4px 18px -4px var(--accent-dim);
  }
  .connect-btn:active { transform: scale(.96); }

  .social-link {
    transition: border-color .2s ease, background-color .2s ease, transform .15s ease;
  }
  .social-link:hover {
    transform: translateY(-1px);
  }

  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .tag, .connect-btn, .social-link { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body class="h-full min-h-screen w-full flex items-center justify-center p-3 sm:p-6 m-0 overflow-x-hidden">

  <!-- Responsive Flexible Full Screen Container -->
  <div class="card w-full max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl rounded-2xl bg-[#0f1712] text-[#e2e8f0] shadow-[0_20px_60px_-15px_rgba(34,197,94,0.15)] ring-1 ring-emerald-500/20 overflow-hidden font-sans my-auto">

    <!-- Banner (Supports background.png or background.gif) -->
    <div class="h-32 sm:h-40 md:h-48 w-full relative bg-[#14281c] overflow-hidden">
      <img
        src="background.png"
        alt="Profile banner"
        class="w-full h-full object-cover opacity-75"
        loading="lazy"
      />
      <div class="absolute inset-0 bg-gradient-to-t from-[#0f1712] via-transparent to-black/20"></div>
    </div>

    <!-- Body -->
    <div class="px-4 sm:px-6 md:px-8 pb-5 sm:pb-6 pt-0 relative">

      <!-- Avatar + Action -->
      <div class="flex justify-between items-end -mt-10 sm:-mt-12 mb-3 sm:mb-4">
        <div class="relative inline-block">
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full overflow-hidden border-[6px] border-[#0f1712] bg-[#0f1712] shadow-md shadow-emerald-900/40">
            <!-- Supports profile.png or profile.gif -->
            <img
              src="profile.png"
              alt="BibekU々 avatar"
              class="w-full h-full object-cover"
              loading="lazy"
            />
          </div>
          <div class="absolute bottom-1 right-1 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-[4px] border-[#0f1712] bg-emerald-400"></div>
        </div>

        <button class="connect-btn bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm sm:text-base px-5 py-2.5 rounded-md shadow-md">
          Connect
        </button>
      </div>

      <!-- Info Card -->
      <div class="bg-[#132219] rounded-xl p-4 sm:p-5 border border-emerald-900/30 space-y-4">

        <div>
          <div class="flex items-center gap-1.5 flex-wrap">
            <h2 class="text-xl sm:text-2xl font-bold text-white leading-tight">! BibekU々</h2>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-400 fill-current shrink-0" viewBox="0 0 24 24">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
          </div>
          <p class="text-xs sm:text-sm text-emerald-300 font-medium tracking-wide">@aoibibeku • 18 • he/him</p>
        </div>

        <div class="h-px bg-emerald-900/30 w-full"></div>

        <div>
          <h3 class="text-xs sm:text-sm font-bold text-emerald-400 uppercase tracking-wider mb-2">About Me</h3>
          <div class="grid grid-cols-2 gap-2 text-sm text-[#cbd5e1]">
            <div class="tag flex items-center gap-2.5 bg-[#172e20] px-3 py-2 rounded-lg border border-emerald-800/40">
              <span>🎌</span><span class="font-medium text-white truncate">Anime</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#172e20] px-3 py-2 rounded-lg border border-emerald-800/40">
              <span>🎮</span><span class="font-medium text-white truncate">Gamer</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#172e20] px-3 py-2 rounded-lg border border-emerald-800/40">
              <span>🎵</span><span class="font-medium text-white truncate">Music</span>
            </div>
            <div class="tag flex items-center gap-2.5 bg-[#172e20] px-3 py-2 rounded-lg border border-emerald-800/40">
              <span>🎨</span><span class="font-medium text-white truncate">Artist</span>
            </div>
          </div>
        </div>

        <div class="pt-1">
          <h3 class="text-xs sm:text-sm font-bold text-emerald-400 uppercase tracking-wider mb-2">Connected Accounts</h3>

          <div class="space-y-2">
            <!-- Instagram Link -->
            <a href="https://instagram.com/aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-lg bg-[#172e20]/85 hover:bg-[#1c3928] border border-emerald-700/40 hover:border-emerald-400 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-300 group-hover:text-emerald-200 shrink-0">
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                    <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-semibold text-white">Instagram</span>
                  <span class="text-[11px] sm:text-xs text-emerald-300/80 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" x2="21" y1="14" y2="3"/>
              </svg>
            </a>

            <!-- TikTok Link -->
            <a href="https://tiktok.com/@aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-lg bg-[#172e20]/85 hover:bg-[#1c3928] border border-emerald-700/40 hover:border-emerald-400 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-300 group-hover:text-emerald-200 shrink-0">
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-semibold text-white">TikTok</span>
                  <span class="text-[11px] sm:text-xs text-emerald-300/80 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" x2="21" y1="14" y2="3"/>
              </svg>
            </a>

            <!-- X (Twitter) Link -->
            <a href="https://x.com/aoibibeku" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-lg bg-[#172e20]/85 hover:bg-[#1c3928] border border-emerald-700/40 hover:border-emerald-400 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-300 group-hover:text-emerald-200 shrink-0">
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-semibold text-white">X (Twitter)</span>
                  <span class="text-[11px] sm:text-xs text-emerald-300/80 truncate">@aoibibeku</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" x2="21" y1="14" y2="3"/>
              </svg>
            </a>

            <!-- Discord Server Link -->
            <a href="https://discord.gg/2y3frhSBRU" target="_blank" rel="noopener noreferrer"
               class="social-link flex items-center justify-between p-3 rounded-lg bg-[#172e20]/85 hover:bg-[#1c3928] border border-emerald-700/40 hover:border-emerald-400 group">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-emerald-300 group-hover:text-emerald-200 shrink-0">
                  <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                  </svg>
                </span>
                <div class="flex flex-col min-w-0">
                  <span class="text-xs sm:text-sm font-semibold text-white">Discord Server</span>
                  <span class="text-[11px] sm:text-xs text-emerald-300/80 truncate">discord.gg/2y3frhSBRU</span>
                </div>
              </div>
              <svg class="w-4 h-4 text-emerald-300 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
                <polyline points="15 3 21 3 21 9"/>
                <line x1="10" x2="21" y1="14" y2="3"/>
              </svg>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
